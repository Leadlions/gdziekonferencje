name: Monthly Conference Scraper

on:
  schedule:
    - cron: '0 7 1 * *'   # 1. dnia kazdego miesiaca o 7:00 UTC
  workflow_dispatch:        # mozliwosc recznego odpalenia

jobs:
  scrape-conferences:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Scrape conferences
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/scrape-conferences.py

      - name: Commit and push
        run: |
          git config --local user.email "bot@gdzie-konferencje.pl"
          git config --local user.name "Conference Bot"
          git add src/data/conferences.json
          git diff --staged --quiet || (git commit -m "Auto: aktualizacja konferencji $(date +%Y-%m)" && git push)
